!

!
version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname R2
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
memory-size iomem 5
no ip icmp rate-limit unreachable
ip cef
!
!
!
!
no ip domain lookup
ip auth-proxy max-nodata-conns 3
ip admission max-nodata-conns 3
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
archive
 log config
  hidekeys
! 
!
!
!
ip tcp synwait-time 5
!
!
!
!
interface FastEthernet0/0
 no ip address
 shutdown
 duplex auto
 speed auto
!
interface FastEthernet0/1
 no ip address
 shutdown
 duplex auto
 speed auto
!
interface Serial1/0
 ip address 10.1.23.1 255.255.255.0
 serial restart-delay 0
!
interface Serial1/1
 ip address 10.1.24.1 255.255.255.0
 serial restart-delay 0
!
interface Serial1/2
 ip address 10.1.12.2 255.255.255.0
 serial restart-delay 0
!
interface Serial1/3
 no ip address
 shutdown
 serial restart-delay 0
!
interface FastEthernet2/0
 no ip address
 shutdown
 duplex auto
 speed auto
!
router eigrp 1
 redistribute ospf 1 metric 2000 100 1 1 1500 route-map mohamed
 network 10.1.23.1 0.0.0.0
 network 10.1.24.1 0.0.0.0
 no auto-summary
!
router ospf 1
 router-id 2.2.2.2
 log-adjacency-changes
 redistribute eigrp 1 subnets route-map roshdy
 network 10.1.12.2 0.0.0.0 area 0
!
ip forward-protocol nd
!
!
no ip http server
no ip http secure-server
!
access-list 1 permit 10.4.0.0 0.0.0.255
access-list 1 permit 10.4.1.0 0.0.0.255
access-list 2 permit 10.4.2.0 0.0.0.255
access-list 2 permit 10.4.3.0 0.0.0.255
access-list 3 permit 10.4.4.0 0.0.0.255
access-list 12 permit 10.1.12.0 0.0.0.255
access-list 13 permit 10.1.13.0 0.0.0.255
no cdp log mismatch duplex
!
!
!
route-map roshdy permit 10
 match ip address 1
 set metric 50
!
route-map roshdy permit 20
 match ip address 2
 set metric 70
 set metric-type type-1
!
route-map roshdy permit 30
 match ip address 3
!
route-map roshdy permit 40
!
route-map mohamed permit 10
 set metric 2000 100 255 1 1500
!
route-map mohamed permit 20
 match ip address 13
!
!
!
!
control-plane
!
!
!
!
!
!
!
!
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line vty 0 4
 login
!
!
end
